    <style>
        /* ── Design tokens ── */
        :root {
            --c-bg: #f4f7fe;
            --c-surface: rgba(255,255,255,0.92);
            --c-surface-strong: #ffffff;
            --c-border: rgba(203,213,225,0.6);
            --c-text1: #0f172a;
            --c-text2: #475569;
            --c-text3: #94a3b8;
            --c-brand1: #4f46e5;
            --c-brand2: #2563eb;
            --c-brand3: #38bdf8;
            --c-ok: #10b981;
            --c-warn: #f59e0b;
            --c-bad: #ef4444;
            --shadow-xs: 0 2px 8px rgba(15,23,42,0.05);
            --shadow-sm: 0 6px 20px rgba(15,23,42,0.07);
            --shadow-md: 0 12px 36px rgba(15,23,42,0.09);
            --shadow-brand: 0 10px 28px rgba(79,70,229,0.22);
            --shadow-ok: 0 8px 22px rgba(16,185,129,0.20);
            --shadow-warn: 0 8px 22px rgba(245,158,11,0.18);
            --r-card: 28px;
            --r-btn: 16px;
        }

        html, body, #root { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background-color: var(--c-bg);
            background-image:
                radial-gradient(ellipse 70% 45% at 8% -5%, rgba(99,102,241,0.16), transparent 70%),
                radial-gradient(ellipse 55% 38% at 95% -2%, rgba(56,189,248,0.13), transparent 70%),
                radial-gradient(ellipse 45% 35% at 82% 55%, rgba(217,70,239,0.06), transparent 70%),
                radial-gradient(ellipse 50% 40% at 5% 85%, rgba(16,185,129,0.06), transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 105%, rgba(79,70,229,0.07), transparent 70%);
            background-attachment: fixed;
            color: var(--c-text1);
            touch-action: manipulation;
        }
        ::selection { background: rgba(99,102,241,0.18); }

        /* card / panel surfaces（内顶高光 + 桌面悬停微抬升 = 质感的主要来源） */
        .card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-card);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), var(--shadow-sm);
        }
        .card-lg {
            background: var(--c-surface-strong);
            border: 1px solid var(--c-border);
            border-radius: 32px;
            box-shadow: inset 0 1.5px 0 rgba(255,255,255,1), 0 1px 2px rgba(15,23,42,0.04), var(--shadow-md);
            transition: box-shadow .25s ease, transform .25s ease;
        }
        @media (hover: hover) {
            .card-lg:hover {
                transform: translateY(-2px);
                box-shadow: inset 0 1.5px 0 rgba(255,255,255,1), 0 2px 4px rgba(15,23,42,0.04), 0 18px 44px rgba(15,23,42,0.11);
            }
        }

        /* 页面切换入场动画（key=tab 触发） */
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .page-enter { animation: pageEnter .3s cubic-bezier(0.21, 0.68, 0.32, 1) both; }
        @keyframes floatIn {
            from { opacity: 0.01; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .float-in { animation: floatIn .45s cubic-bezier(0.21, 0.68, 0.32, 1) both; }
        @media (prefers-reduced-motion: reduce) {
            .page-enter, .float-in { animation: none; }
            .card-lg { transition: none; }
        }
        .glass {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.65);
            box-shadow: var(--shadow-md);
        }

        /* buttons */
        .btn-brand {
            background: linear-gradient(135deg, var(--c-brand1), var(--c-brand2));
            color: #fff;
            box-shadow: var(--shadow-brand);
            border-radius: var(--r-btn);
            font-weight: 700;
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
        }
        .btn-brand:active { transform: scale(0.97); opacity: 0.9; }

        .btn-ok {
            background: var(--c-ok);
            color: #fff;
            box-shadow: var(--shadow-ok);
            border-radius: var(--r-btn);
            font-weight: 700;
            transition: transform .18s ease, opacity .18s ease;
        }
        .btn-ok:active { transform: scale(0.97); }

        .btn-warn {
            background: var(--c-warn);
            color: #fff;
            box-shadow: var(--shadow-warn);
            border-radius: var(--r-btn);
            font-weight: 700;
            transition: transform .18s ease, opacity .18s ease;
        }
        .btn-warn:active { transform: scale(0.97); }

        .btn-ghost {
            background: rgba(248,250,252,0.9);
            border: 1.5px solid var(--c-border);
            color: var(--c-text2);
            border-radius: var(--r-btn);
            font-weight: 600;
            transition: background .15s ease, border-color .15s ease;
        }
        .btn-ghost:hover { background: #fff; border-color: #cbd5e1; }
        .btn-ghost:active { background: #f1f5f9; }

        /* nav items */
        .nav-item {
            border-radius: 14px;
            font-weight: 600;
            color: var(--c-text2);
            transition: background .15s ease, color .15s ease, box-shadow .15s ease;
        }
        .nav-item:hover { background: rgba(241,245,249,0.9); }
        .nav-item.active {
            background: linear-gradient(135deg, var(--c-brand1), var(--c-brand2));
            color: #fff;
            box-shadow: 0 8px 22px rgba(79,70,229,0.20);
        }

        /* progress bar */
        .pbar-track {
            background: rgba(226,232,240,0.7);
            border-radius: 999px;
            overflow: hidden;
        }
        .pbar-fill {
            background: linear-gradient(90deg, var(--c-brand1), var(--c-brand2), var(--c-brand3));
            border-radius: 999px;
            transition: width 0.9s cubic-bezier(0.4,0,0.2,1);
        }
        .pbar-fill-ok  { background: linear-gradient(90deg, #10b981, #34d399); }
        .pbar-fill-mid { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .pbar-fill-low { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

        /* stat chips */
        .stat-chip {
            background: rgba(248,250,252,0.95);
            border: 1px solid rgba(226,232,240,0.9);
            border-radius: 14px;
        }

        /* quiz answer options */
        .option-default {
            background: rgba(248,250,252,0.9);
            border: 2px solid rgba(226,232,240,0.9);
            border-radius: 18px;
            transition: background .14s ease, border-color .14s ease, transform .14s ease;
        }
        .option-default:hover { background: #fff; border-color: #94a3b8; transform: translateY(-1px); }
        .option-correct { background: rgba(209,250,229,0.9); border-color: #10b981; }
        .option-wrong   { background: rgba(254,226,226,0.9); border-color: #ef4444; }

        /* teacher banner */
        .teacher-banner {
            background: linear-gradient(135deg, var(--c-brand1) 0%, var(--c-brand2) 60%, var(--c-brand3) 100%);
            border-radius: 24px;
            box-shadow: 0 16px 42px rgba(79,70,229,0.20);
        }

        /* gradient logo text */
        .logo-text {
            background: linear-gradient(135deg, var(--c-brand1), var(--c-brand2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* card flip */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        /* misc */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .ios-shadow { box-shadow: var(--shadow-sm); }
        .ios-blur {
            background-color: rgba(255,255,255,0.80);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        * { -webkit-tap-highlight-color: transparent; }
        button, select, input { outline: none; }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 999px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
    <link rel="stylesheet" href="/tailwind.css">
</head>

<script src="/app.js" defer></script>

        // 注册 Service Worker：离线可用 + 缓存本地资源（详见 sw.js）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () { /* 注册失败不影响使用 */ });
            });
        }
    </script>
